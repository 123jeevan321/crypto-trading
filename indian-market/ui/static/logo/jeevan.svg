<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2979ff" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#b0bec5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Bull Icon Container -->
  <g transform="translate(6, 6)">
    <!-- Shield / Hexagon Backing -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#12121e" stroke="url(#bullGrad)" stroke-width="2" />
    
    <!-- Bull Head Silhouette -->
    <!-- Horn Left -->
    <path d="M 12 18 C 10 10 14 6 18 8 C 17 12 15 15 17 18 Z" fill="url(#bullGrad)" filter="url(#glow)" />
    <!-- Horn Right (Upward charging) -->
    <path d="M 36 18 C 38 10 34 6 30 8 C 31 12 33 15 31 18 Z" fill="url(#bullGrad)" filter="url(#glow)" />
    <!-- Forehead & Face -->
    <polygon points="17,17 31,17 34,26 24,38 14,26" fill="url(#bullGrad)" />
    <!-- Eyes -->
    <circle cx="20" cy="23" r="1.5" fill="#0f0f18" />
    <circle cx="28" cy="23" r="1.5" fill="#0f0f18" />
    <!-- Snout & Ring -->
    <ellipse cx="24" cy="31" rx="4" ry="2.5" fill="#0f0f18" />
    <path d="M 22 33 A 2 2 0 0 0 26 33" stroke="url(#bullGrad)" stroke-width="1.5" fill="none" />
    <!-- Dynamic Chart Sparkline underneath -->
    <polyline points="4,42 16,36 28,40 44,28" fill="none" stroke="#00e676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="44" cy="28" r="2" fill="#00e676" filter="url(#glow)" />
  </g>

  <!-- Typography: J1 Trader -->
  <text x="64" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="22" letter-spacing="-0.5" fill="#ffffff">
    J1 <tspan fill="url(#bullGrad)">TRADER</tspan>
  </text>

  <!-- Subtitle -->
  <text x="65" y="46" font-family="'Inter', sans-serif" font-weight="600" font-size="9" letter-spacing="2" fill="#78909c">
    SMART SIGNALS &amp; IPO DESK
  </text>
  
  <!-- Active Pulse Indicator -->
  <circle cx="265" cy="28" r="4" fill="#00e676" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>